name: Research public-parameter EA signals Aug-Oct 2026
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/chinese-ea-public-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install 'pandas>=2.2,<3' numpy requests
      - name: Restore pinned backtest script
        env:
          BASE64_SCRIPT: ''
        run: |
          python - <<'PY'
          import os,base64,zlib,hashlib,pathlib
          b=zlib.decompress(base64.b64decode(os.environ['BASE64_SCRIPT']))
          old = "AGG={**{f'{s}_{f}':f for s in ['bid','ask'] for f in ['open','high','low','close']},'tick_count':'sum'}"
          replacement = "FUNC={'open':'first','high':'max','low':'min','close':'last'}\nAGG={**{f'{s}_{f}':FUNC[f] for s in ['bid','ask'] for f in FUNC},'tick_count':'sum'}"
          script=b.decode('utf-8')
          assert script.count(old)==1, 'Pinned source changed'
          script=script.replace(old,replacement)
          pathlib.Path('chinese_ea_public_backtest_2026.py').write_text(script,encoding='utf-8')
          print('SOURCE_SHA256',hashlib.sha256(script.encode()).hexdigest())
          PY
      - name: Run three fixed M15 research strategies
        run: python chinese_ea_public_backtest_2026.py
      - name: Publish evidence including trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-ea-public-2026-aug-oct-backtest
          path: chinese_ea_2026_results/
          if-no-files-found: warn
          retention-days: 30
