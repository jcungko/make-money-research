name: EURUSD Oct 2026 >30pct intrabar tick TP SL screen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eurusd-oct2026-intrabar-30pct-brackets.yml'
permissions:
  contents: write
concurrency:
  group: eurusd-oct2026-intrabar-30pct-brackets
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Evaluate chronological Bid Ask TP SL and timeout exits
        run: python scripts/eurusd_oct2026_intrabar_30pct_brackets.py
      - name: Publish complete experimental outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eurusd_oct2026_intrabar_30pct_brackets/
          if ! git diff --cached --quiet; then
            git commit -m "Research: October EURUSD tick TP SL frequency screen"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Results unchanged"
          fi
      - name: Store experiment archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EURUSD-Oct2026-M1-M5-Bracket-30percent
          path: results/eurusd_oct2026_intrabar_30pct_brackets/
          if-no-files-found: warn
          retention-days: 30
