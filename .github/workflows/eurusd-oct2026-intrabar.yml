name: EURUSD Oct 2026 intrabar M1 M5 backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eurusd-oct2026-intrabar.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tick backtest dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'numba>=0.60,<1'
      - name: Replay M1 M5 tick-only intrabar strategies
        run: python scripts/eurusd_oct2026_intrabar_screen.py
      - name: Publish paper research results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eurusd_oct2026_intrabar/
          if git diff --cached --quiet; then
            echo "No changed results"
          else
            git commit -m "Results: Oct 2026 EURUSD intrabar tick replay"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve evidence and ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EURUSD-Oct2026-M1-M5-intrabar-report
          path: results/eurusd_oct2026_intrabar/
          if-no-files-found: warn
          retention-days: 30
