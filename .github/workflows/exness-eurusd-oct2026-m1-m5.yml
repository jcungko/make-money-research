name: Exness EURUSD Oct 2026 M1 M5 collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exness-eurusd-oct2026-m1-m5.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis requirements
        run: python -m pip install 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Download Exness monthly tick data and build bid ask candles
        run: python scripts/exness_eurusd_oct2026_m1_m5.py
      - name: Persist source audits and candle data to research repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exness/EURUSD_2026_10_M1_M5/
          if git diff --cached --quiet; then
            echo "Research data already exists"
          else
            git commit -m "Data: Exness EURUSD Oct 2026 M1 and M5 bid ask"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive portable copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Exness-EURUSD-October-2026-M1-M5-UTC
          path: data/exness/EURUSD_2026_10_M1_M5/
          if-no-files-found: warn
          retention-days: 30
