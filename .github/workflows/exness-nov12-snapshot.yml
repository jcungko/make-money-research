name: Exness Nov12 latest public ticks snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exness-nov12-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Download public tick history and screen conditional trade
        run: python scripts/exness_nov12_snapshot.py
      - name: Preserve snapshot in repository
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/exness_nov12_2026/
          if ! git diff --cached --quiet; then
            git commit -m 'Exness public tick snapshot Nov 10-12 (research only)'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exness-public-ticks-nov12-2026
          path: results/exness_nov12_2026/
          if-no-files-found: warn
          retention-days: 14
