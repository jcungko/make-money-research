name: FX M5 Directional 15 30 60 minute bracket holdout research
on:
  push:
    branches: [research/m5-hedged-tp050-sl10-aug-oct2026]
    paths:
      - 'scripts/m5_longer_hold_2026.py'
      - '.github/workflows/m5-longer-hold-2026.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Backtest M5 direction with longer intrabar SL TP holding
        run: python scripts/m5_longer_hold_2026.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx-m5-longer-hold-results
          path: results/m5_longer_hold_2026/
          if-no-files-found: warn
