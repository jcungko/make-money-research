name: Research USOIL H1 SL5 TP10 and TP5 Aug-Oct 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-usoil-h1-sl5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    name: Two SL5 variants; keep baseline unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3'
      - run: python scripts/usoil_h1_majority_sl5_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: usoil-h1-sl5-tp10-tp5-aug-oct-2026
          path: |
            results/usoil_h1_majority_sl5_tp10_2026/
            results/usoil_h1_majority_sl5_tp5_2026/
      - name: Publish results without modifying existing baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/usoil_h1_majority_sl5_tp10_2026/ results/usoil_h1_majority_sl5_tp5_2026/
          if ! git diff --cached --quiet; then
            git commit -m "Research: USOIL H1 SL5 TP10 and TP5 Aug-Oct 2026 results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
