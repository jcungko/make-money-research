name: MAKE MONEY independent research (paper only)
on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: make-money-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Backtest next batch without trading access
        env:
          MODEL_BUDGET: '12'
          MAX_COINS: '2'
          MAX_RUNTIME_SECONDS: '1050'
        run: python research.py
      - name: Persist state and research journal
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m 'research: checkpoint experiments'
            git pull --rebase
            git push
          fi
