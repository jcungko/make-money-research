name: USDJPY D1 Consistency Historical Research (isolated)
on:
  push:
    branches:
      - research/usdjpy-d1-consistency-20261117
    paths:
      - .github/workflows/usdjpy-d1-consistency-20261117.yml
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - name: Decode versioned protocol and run D1 stop-first backtest
        shell: bash
        run: |
          mkdir -p research_usdjpy
          echo '' | base64 -d | gzip -d > research_usdjpy/d1_consistency.py
          python research_usdjpy/d1_consistency.py
      - name: Publish evidence on isolated branch only
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_usdjpy/d1_consistency.py results/usdjpy_d1_consistency_20261117/
          if ! git diff --cached --quiet; then
            git commit -m "Research: USDJPY 2026 D1 reproducible SL TP backtest and evidence"
            git push origin HEAD:research/usdjpy-d1-consistency-20261117
          fi
      - name: Save report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-d1-consistency-evidence
          path: results/usdjpy_d1_consistency_20261117/
          if-no-files-found: warn
          retention-days: 30
