name: USDJPY Research Autopilot R1 — research only
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy-research-autopilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: usdjpy-r1-research-isolated
  cancel-in-progress: false
jobs:
  research:
    if: ${{ github.repository == 'jcungko/make-money-research' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research branch (no old project changes)
        uses: actions/checkout@v4
        with:
          ref: research/usdjpy-autopilot-20261116
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore last validated research cursor from previous GitHub artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_usdjpy/results
          restored=0
          while read -r id; do
            [ -n "$id" ] || continue
            mkdir -p /tmp/usdjpy-previous
            if gh run download "$id" -n "usdjpy-checkpoint-$id" -D /tmp/usdjpy-previous >/dev/null 2>&1; then
              if [ -s /tmp/usdjpy-previous/state.json ]; then
                cp /tmp/usdjpy-previous/state.json research_usdjpy/results/state.json
                echo "RESTORED_CURSOR_FROM_RUN=$id"
                restored=1
                break
              fi
            fi
          done < <(gh run list --workflow 'usdjpy-research-autopilot.yml' --limit 30 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId')
          if [ "$restored" -eq 0 ]; then
            echo 'BOOTSTRAP_NEW_CURSOR=0 (no prior durable checkpoint)'
          fi
      - name: Install free research-only libraries
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3'
      - name: Validate core invariants before research
        run: python -m unittest discover -s research_usdjpy -p 'test_*.py' -v
      - name: Run REAL Exness USDJPY experiments (explicit BLOCKED on error)
        run: python research_usdjpy/engine.py
      - name: Upload state AND complete per-trade evidence for current cycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-checkpoint-${{ github.run_id }}
          path: research_usdjpy/results/
          retention-days: 90
          if-no-files-found: error
