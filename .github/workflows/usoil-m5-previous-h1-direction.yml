name: USOIL M5 previous completed H1 direction backtest
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usoil-m5-previous-h1-direction.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3'
      - run: python scripts/usoil_m5_previous_h1_direction_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: usoil-m5-prev-h1-direction-2025-2026
          path: results/usoil_m5_previous_h1_direction_2025_2026/
      - name: Publish isolated research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/usoil_m5_previous_h1_direction_2025_2026/
          if ! git diff --cached --quiet; then
            git commit -m "Research: USOIL M5 previous H1 direction results 2025/2026"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
