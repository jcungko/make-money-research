name: V12 Exness 2026 public tick OHLC collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v12-exness-2026.yml'
      - 'scripts/v12_exness_collect.py'
permissions:
  contents: read
jobs:
  collect:
    name: Download and aggregate ${{ matrix.symbol }} 2026
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURUSD, USDJPY, GBPUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: pip install 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Verify candle aggregation with synthetic data
        run: python scripts/v12_exness_collect.py --self-test
      - name: Download public Exness 2026 ticks and aggregate M5 M15 M30 H1 H4
        run: python scripts/v12_exness_collect.py --symbol "${{ matrix.symbol }}" --year 2026 --out v12_exness_data
      - name: Upload CSV.gz files and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Exness-V12-${{ matrix.symbol }}-2026-UTC
          path: v12_exness_data/
          if-no-files-found: warn
          retention-days: 30
