name: V12-01 November 11 Exness tick snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v12-nov11-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download day archives (public tick market data only)
        shell: bash
        run: |
          mkdir -p nov11_exness
          python - <<'PY'
          import requests, pathlib,zipfile,datetime
          out=pathlib.Path('nov11_exness')
          print('Fetched timestamp UTC:',datetime.datetime.now(datetime.timezone.utc).isoformat())
          for symbol in ('EURUSD','USDJPY','GBPUSD'):
              url=f'https://ticks.ex2archive.com/ticks/{symbol}/2026/11/11/Exness_{symbol}_2026_11_11.zip'
              r=requests.get(url,timeout=60)
              r.raise_for_status()
              p=out/f'Exness_{symbol}_2026_11_11.zip'
              p.write_bytes(r.content)
              with zipfile.ZipFile(p) as z:
                  files=z.namelist()
                  print(symbol,'ZIP bytes',len(r.content),'filenames',files)
                  for file in files:
                      if not file.lower().endswith('.csv'):continue
                      with z.open(file) as inp:
                          first=inp.readline()
                          second=inp.readline()
                          print(symbol,'headers and first row',first[:200],second[:200])
              print(symbol,'mtime header',r.headers.get('last-modified'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V12-Nov11-daily-ticks-2026
          path: nov11_exness/
          retention-days: 7
