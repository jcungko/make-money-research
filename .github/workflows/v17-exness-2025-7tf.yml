name: V17 Exness 2025 seven-timeframe dataset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v17-exness-2025-7tf.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v17-exness-2025-package
  cancel-in-progress: false
jobs:
  assemble:
    name: Assemble verified 2025 bid/ask M5-M15-M30-H1-H4-D1-W1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candle aggregation dependencies
        run: pip install 'pandas>=2.2,<3'
      - name: Download all three verified V12 2025 archive artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v17_input
          for symbol in EURUSD USDJPY GBPUSD; do
            gh run download 42975297240 -n "Exness-V12-${symbol}-2025-UTC" --dir "v17_input/${symbol}"
          done
          test "$(find v17_input -name '*_M5_2025_UTC.csv.gz' | wc -l)" -eq 3
      - name: Validate source candles and derive D1 and W1
        run: python scripts/v17_exness_prepare.py --input v17_input --out data/v17_exness_2025 --run-id 42975297240 --year 2025
      - name: Commit durable data archives to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v17_exness_2025/
          if ! git diff --cached --quiet; then
            git commit -m "V17: package Exness 2025 OHLC seven timeframes three pairs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload portable source ZIP files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V17-Exness-2025-SevenTimeframes
          path: data/v17_exness_2025/
          if-no-files-found: warn
          retention-days: 30
