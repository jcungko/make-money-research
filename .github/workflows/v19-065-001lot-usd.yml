name: V19-065 USD PnL at 0.01 lot per bot with 4pct SL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v19-065-001lot-usd.yml'
      - 'scripts/v19_065_sl4_001lot_usd.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  pnl-usd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Compute USD PnL on 17 stops and time exits
        run: python scripts/v19_065_sl4_001lot_usd.py
      - name: Validate and commit report
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='results/v19_sl_research/V19_065_SL4_Nov2026_001lot_USD.json'
          r=json.load(open(p))
          assert r['total_trades']==17
          assert r['stop_count']==2
          assert abs(r['total_profit_bp_equal_weight_simulation']-172.23601)<.0001
          assert abs(sum(x['pnl_usd'] for x in r['orders'])-r['total_profit_usd'])<.0001
          print('Validated V19-065 USD model',r['total_profit_usd'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v19_sl_research/V19_065_SL4_Nov2026_001lot_USD.json results/v19_sl_research/V19_065_SL4_Nov2026_001lot_USD_orders.csv
          if ! git diff --cached --quiet; then
            git commit -m "V19-065: publish Nov 2026 0.01-lot PnL in USD"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V19-065-001lot-Nov2026-USD
          path: results/v19_sl_research/V19_065_SL4_Nov2026_001lot_USD*
          if-no-files-found: warn
          retention-days: 30
