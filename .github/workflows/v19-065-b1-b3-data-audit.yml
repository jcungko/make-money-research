name: V19-065 verify B1 B3 signal and tradable quotes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v19-065-b1-b3-data-audit.yml'
      - 'scripts/v19_065_b1_b3_data_audit.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Verify signal and valid market quotes by hour and date
        run: python scripts/v19_065_b1_b3_data_audit.py
      - name: Validate and commit independent audit results
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open("results/v19_sl_research/V19_065_B1_B3_signal_data_audit.json"))
          a=d['checks']
          assert a['B1']['nov_closed_orders']==1
          assert a['B3']['nov_closed_orders']==0
          assert a['B1']['qualified_nov_scheduled_bars']==1
          assert a['B3']['qualified_nov_scheduled_bars']==0
          print('V19 audit OK')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v19_sl_research/V19_065_B1_B3_signal_data_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "V19-065: save independent signal and market-hours integrity audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V19-065-B1-B3-data-audit
          path: results/v19_sl_research/V19_065_B1_B3_signal_data_audit.json
          if-no-files-found: warn
          retention-days: 30
