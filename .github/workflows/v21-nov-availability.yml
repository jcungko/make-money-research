name: V21 November 2026 Exness availability probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/v21-nov-availability.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the public archive for 2026-11 BTCUSD and ETHUSD
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          sess=requests.Session()
          sess.headers.update({'User-Agent':'V21 crypto forward-testing availability probe'})
          for sym in ('BTCUSD','ETHUSD'):
              base=f'https://ticks.ex2archive.com/ticks/{sym}/2026/11/'
              urls=[base,base+f'Exness_{sym}_2026_11.zip']
              for d in (1,10,11,12):
                  urls.extend([base+f'{d:02d}/',base+f'Exness_{sym}_2026_11_{d:02d}.zip',base+f'{d:02d}/Exness_{sym}_2026_11_{d:02d}.zip'])
              for url in urls:
                  try:
                      r=sess.get(url,timeout=(8,25),stream=True,allow_redirects=True)
                      print('AVAIL',json.dumps({'symbol':sym,'url':url,'status':r.status_code,'content_type':r.headers.get('content-type'),'size':r.headers.get('content-length'),'sample':r.raw.read(400).decode('utf-8','replace') if 'zip' not in r.headers.get('content-type','') else 'binary-zip'}),flush=True)
                      r.close()
                  except Exception as exc:
                      print('AVAIL_ERR',url,type(exc).__name__,str(exc)[:160],flush=True)
          PY
