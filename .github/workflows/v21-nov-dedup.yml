name: V21 November no-duplicate portfolio audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-nov-dedup.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v21-nov-overlap-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic research dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Audit historical 22 month trade timing and strategy overlap
        run: python scripts/v21_nov2026_dedup.py
      - name: Commit the V21 dedup results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v21_crypto_screen/V21_nov2026_no_overlap_audit.json data/v21_crypto_screen/V21_nov2026_no_overlap_audit.md
          git commit -m 'V21: remove redundant November portfolios based on real historical entry collisions'
          for trial in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((trial * 4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V21-November-No-duplicate-Audit
          path: |
            data/v21_crypto_screen/V21_nov2026_no_overlap_audit.json
            data/v21_crypto_screen/V21_nov2026_no_overlap_audit.md
          retention-days: 30
          if-no-files-found: warn
