name: V21 November 2026 replay — freeze 199 portfolios and exclude losers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-nov2026-replay.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v21-199-nov2026-forward
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and Exness download libraries
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Reconstruct original 199 portfolios and forward-test real Exness quotes
        run: python scripts/v21_nov2026_screen.py
      - name: Publish complete kept/excluded November results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v21_crypto_screen/V21_nov2026_forward_199.json data/v21_crypto_screen/V21_nov2026_forward_199.csv data/v21_crypto_screen/V21_nov2026_forward_199.md
          git commit -m 'V21: November forward-screen the frozen 199 crypto portfolios'
          for trial in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((trial * 4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V21-199-November-forward-report
          path: |
            data/v21_crypto_screen/V21_nov2026_forward_199.json
            data/v21_crypto_screen/V21_nov2026_forward_199.csv
            data/v21_crypto_screen/V21_nov2026_forward_199.md
          retention-days: 30
          if-no-files-found: warn
