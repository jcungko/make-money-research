name: V21 Exness November 2026 frozen 50 portfolios
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-november-50.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v21-november-50-frozen-out-of-sample
  cancel-in-progress: false
jobs:
  replay:
    name: Exness BTCUSD ETHUSD Nov1-12 2026 real tick replay
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible research dependencies
        run: pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Replay same 50 portfolios with November daily Exness tick history
        run: python scripts/v21_november_replay.py
      - name: Publish audit outputs and keep full trade ledger
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v21_november_replay/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'V21: November frozen 50 portfolios replay and positive-PnL survivor list'
            for trial in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((trial*3))
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V21-November-2026-50-portfolio-replay
          path: data/v21_november_replay/
          retention-days: 30
          if-no-files-found: warn
