name: V21 P4-195 ATR SL and total risk backtest
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-p4-195-risk.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v21-p4-195-risk-overlay
  cancel-in-progress: false
jobs:
  risk-backtest:
    name: Frozen P4-195 ATR stop and shared risk 2025 2026 November
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only backtesting dependencies
        run: pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Replay exact four original bot entries, add SL and shared risk controls
        run: python scripts/v21_p4_195_risk_backtest.py
      - name: Publish complete audit only after successful result
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v21_p4_195_risk/
          if ! git diff --cached --quiet; then
            git commit -m 'V21: publish validated P4-195 ATR stop and risk backtest'
            for trial in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((trial*3))
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V21-P4-195-ATR-SL-risk-backtest
          path: data/v21_p4_195_risk/
          retention-days: 30
          if-no-files-found: warn
