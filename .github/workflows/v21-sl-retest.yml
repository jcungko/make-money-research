name: V21 10 crypto strategies add hard stop loss and retest
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-sl-retest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v21-sl-retest-10-selected
  cancel-in-progress: false
jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Exness 2025 Oct2026 plus Nov SL retest and parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Run mandatory stop-loss study on selected 10
        run: python scripts/v21_sl_retest.py
      - name: Persist full audited results and stop-loss trade ledger
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v21_sl_retest/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'V21: archive 10-portfolios mandatory SL retest Jan2025 to Nov2026'
            for trial in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((trial*3))
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V21-crypto-10-strategies-hard-SL-2025-Nov2026
          path: data/v21_sl_retest/
          retention-days: 30
          if-no-files-found: warn
