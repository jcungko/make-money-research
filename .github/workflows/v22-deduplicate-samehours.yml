name: V22 final dedup same assets same entry hours and similar signals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v22-deduplicate-samehours.yml'
      - 'scripts/v22_deduplicate_samehours.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dedup_time:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research
        run: pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31'
      - name: Reconcile same asset same-hour multi-EA portfolios
        run: python -u scripts/v22_deduplicate_samehours.py
      - name: Preserve final verified shortlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V22-Final-Distinct-Portfolios
          path: results/v22_deduplicated_final/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v22_deduplicated_final/
          if ! git diff --cached --quiet; then
            git commit -m "V22: final same-hour dedup and replacement audit"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep "$((n * 3))"
            done
            exit 1
          fi
