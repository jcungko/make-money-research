name: V22 filter loss November 2026 to 2026-11-12 19:55 UTC
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v22-nov2026-filter.yml'
      - 'scripts/v22_nov2026_filter.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  november_filter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research dependencies
        run: pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31'
      - name: Replay October survivors using Exness November tick data
        run: python -u scripts/v22_nov2026_filter.py --out results/v22_nov2026_filter
      - name: Attach independent research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V22-Nov-to-Nov12-Strategy-Filtered
          path: results/v22_nov2026_filter/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish November data and complete retained list
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v22_nov2026_filter/
          if ! git diff --cached --quiet; then
            git commit -m "V22: Nov-to-date Exness data and October survivors screened"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep "$((n * 3))"
            done
            exit 1
          fi
