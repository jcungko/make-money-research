name: V22 discover Exness CFD stock strategies profitable in every 2025-2026 month
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v22-strategy-screen.yml'
      - 'scripts/v22_strategy_screen.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only research tools
        run: pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Run bid-ask strategy and portfolio screen on 5 stocks
        run: python -u scripts/v22_strategy_screen.py --root data/v22_exness --out results/v22_strategy_screen
      - name: Save report as workflow artifact even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V22-Monthly-Profit-Screen
          path: results/v22_strategy_screen/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit long-term audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v22_strategy_screen/
          if ! git diff --cached --quiet; then
            git commit -m "V22: report month-by-month strategies 2025-2026"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep "$((n * 3))"
            done
            exit 1
          fi
