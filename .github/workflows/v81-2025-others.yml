name: V8.1 locked H1 H4 EURUSDm candidates on 2025
on:
  push:
    paths:
      - 'research/v81_2025_other_families.py'
      - '.github/workflows/v81-2025-others.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compare 2026-selected strategy variants in 2025
        run: python research/v81_2025_other_families.py
      - name: Commit small diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name v81-research-bot
          git config user.email v81-research-bot@users.noreply.github.com
          git add results/v81_2025_other_families/
          if ! git diff --cached --quiet; then
            git commit -m 'Save 2025 replicate test for 2026 alternative EURUSDm signals'
            git pull --rebase
            git push
          fi
