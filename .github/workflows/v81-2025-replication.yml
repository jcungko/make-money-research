name: V8.1 2025 EURUSDm replication of frozen 2026 signals (research only)
on:
  push:
    paths:
      - 'research/v81_validate_2025.py'
      - '.github/workflows/v81-2025-replication.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: v81-2025-replication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Restore pre-collected public 2025 EURUSDm tick archive
        uses: actions/download-artifact@v4
        with:
          name: v7-exness-eurusdm-2025-tick-source
          run-id: 42650901968
          github-token: ${{ github.token }}
          path: 2025_input
      - name: Convert raw ticks to M15 and run FROZEN selected candidates
        shell: bash
        run: |
          set -euo pipefail
          find 2025_input -maxdepth 3 -type f -printf '%p %s bytes\n'
          SOURCE=$(find 2025_input -type f -name 'Exness_EURUSDm_2025.zip' -print -quit)
          test -n "$SOURCE" || { echo 'Missing 2025 raw tick archive'; exit 1; }
          python research/v81_validate_2025.py --tick "$SOURCE"
      - name: Commit small reproducible 2025 M15 dataset and validation output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name v81-research-bot
          git config user.email v81-research-bot@users.noreply.github.com
          git add data/exness/EURUSDm_2025/ results/v81_daily_2025_validation/
          if ! git diff --cached --quiet; then
            git commit -m 'Record 2025 out-of-year validation of preselected V8.1 candidates'
            git pull --rebase
            git push
          fi
