name: V8-A EURUSDm monthly diagnostics SL0.30 RR1-5 (research only)
on:
  push:
    paths:
      - 'research/v8a_monthly_diagnostic.py'
      - '.github/workflows/v8a-monthly-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v8a-monthly-diagnostics
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Analyze existing verified V8-A trades with Bid Ask OHLC
        run: python research/v8a_monthly_diagnostic.py
      - name: Save monthly breakdown
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'v8a-research-bot'
          git config user.email 'v8a-research-bot@users.noreply.github.com'
          git add results/v8a_box_breakout_2026/
          if ! git diff --cached --quiet; then
            git commit -m 'Record V8-A monthly loss diagnostics'
            git push
          fi
